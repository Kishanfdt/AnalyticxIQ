version: '3.8'

services:
  database:
    image: postgres:15-alpine
    container_name: analyticiq-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_db_password_123
      POSTGRES_DB: analyticiq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: analyticiq-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://postgres:secure_db_password_123@database:5432/analyticiq?schema=public
      JWT_SECRET: super_secure_production_jwt_secret_9999
    depends_on:
      - database

volumes:
  pgdata:
